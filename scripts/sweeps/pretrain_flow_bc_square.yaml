program: pretrain_flow_bc.py
method: grid  # Can be: grid, random, bayes
name: flow_bc_parameter_sweep_square
project: flow-bc  # 设置 your W&B project name here
entity: far-wandb  # Optional: 设置 your W&B entity/team name

# 可在此处指定额外固定参数
command:
  - ${env}
  - python
  - ${program}
  - --policy
  - flowmatching
  - --dataset
  - ankile/robomimic-mh-square-image
  - --image_observation_keys
  - agentview_image
  - --num_workers
  - 16
  - --wandb_project
  - flow-bc
  - --log_freq
  - 10
  - --save_freq
  - 1000
  - --rollout_freq
  - 1000
  - --steps
  - 1_000_000
  - --eval_env
  - Square
  - --eval_num_envs
  - 25
  - --eval_num_episodes
  - 50
  - --experiment
  - flow_bc_square_sweep
  - --wandb_enable
  - True
  # 取消注释以限制数据集大小，从而加快实验：
  - --max_num_episodes
  - 100
  - ${args} 

parameters:

  seed:
    values: [3]

  grad_clip_norm:
    values: [1.0, 25.0]
    
  enable_geometric_augmentations:
    values: [True]

  mlp_dims:
    values:
      - [1024, 1024, 1024]

  network_architecture:
    values: ["mlp"]

  vision_backbone:
    values: ["vit"]

  transported_clip_value:
    values: [None]

  cfm_loss_use_huber:
    values: [False, True]

  cfm_loss_huber_delta:
    values: [0.5]

  # Flow model 采样
  sampling_steps:
    values: [10]

  horizon:
    values: [16]

  n_action_steps:
    values: [8]

  batch_size:
    values: [512]

  learning_rate:
    values: [1e-4]

  lr_backbone:
    values: [1e-5]

  # 权重衰减
  weight_decay:
    values: [1e-6]

  # Flow 网络配置
  flow_network_output_param:
    values: ["u", "x0"]  # velocity or position

  # CFM loss 模式
  cfm_loss_mode:
    values: ["u", "x0"]  # velocity, position, or epsilon

  ema_power:
    values: [0.995]
    